<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LagsPhotography</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Raleway:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            font-family: 'Raleway', sans-serif;
            background: #fff;
        }

        .navbar {
            padding: 15px 0;
            background: #fff !important;
        }
        .navbar-brand {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            color: #222 !important;
            border-right: 1px solid #ccc;
            padding-right: 20px;
            margin-right: 10px;
        }
        .nav-link {
            color: #555 !important;
            font-size: 10px;
            letter-spacing: 2px;
            font-weight: 600;
            border: 1px solid transparent;
            padding: 4px 10px !important;
            transition: all 0.2s;
        }
        .nav-link:hover {
            color: #000 !important;
            border: 1px solid #000;
        }
        .nav-link.active {
            color: #000 !important;
            border: 1px solid #000;
        }

        .hero-section {
            padding: 50px 0 30px 0;
        }
        .hero-section h2 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .hero-section h4 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .hero-section .text-muted {
            font-size: 10px;
            letter-spacing: 3px;
        }

        .filter-buttons {
            margin: 25px 0 20px 0;
        }
        .filter-buttons .btn {
            font-size: 11px;
            letter-spacing: 1px;
            padding: 4px 18px;
            border-radius: 20px;
            border: 1px solid transparent;
            color: #555;
            background: transparent;
            box-shadow: none !important;
        }
        .filter-buttons .btn.active {
            border: 1px solid #555;
            color: #333;
            background: transparent;
        }
        .filter-buttons .btn:hover {
            color: #000;
        }

        .gallery-section {
            padding: 10px 0;
        }
        .gallery-section .col-sm-3 {
            padding: 2px;
        }
        .gallery-section img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        footer {
            padding: 35px 0 20px 0;
            margin-top: 20px;
        }
        .footer-brand {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            margin-bottom: 5px;
        }
        footer p {
            font-size: 11px;
            color: #888;
            margin-bottom: 10px;
        }
        footer i {
            font-size: 16px;
            margin: 0 5px;
            color: #666;
            transition: color 0.2s;
        }
        footer i:hover {
            color: #000;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-light">
        <div class="container">
            <a class="navbar-brand" href="#home">LagsPhotography</a>
            <ul class="nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="#">HOME</a></li>
                <li class="nav-item"><a class="nav-link" href="#">ABOUT ME</a></li>
                <li class="nav-item"><a class="nav-link" href="#">PORTFOLIO</a></li>
                <li class="nav-item"><a class="nav-link" href="#">CONTACT</a></li>
            </ul>
        </div>
    </nav>

    <div class="container text-center hero-section">
        <h2>Hi, Hello.. I Am LuckyaAri...!</h2>
        <h4><strong>I Travel Around The World To Get The Best Photos.!</strong></h4>
        <p class="text-muted">AWARD WINNING PHOTOGRAPHER / CINEMATOGRAPHER / WRITER</p>
        <div class="filter-buttons">
            <button class="btn active" data-filter="all">All</button>
            <button class="btn" data-filter="landscape">Landscape</button>
            <button class="btn" data-filter="portrait">Portrait</button>
            <button class="btn" data-filter="product">Product</button>
        </div>
    </div>

    <div class="container gallery-section">
        <div class="row g-1">
            <div class="col-sm-3"><img src="img/foto1.jpeg" class="img-fluid"></div>
            <div class="col-sm-3"><img src="img/foto2.jpeg" class="img-fluid"></div>
            <div class="col-sm-3"><img src="img/foto3.jpeg" class="img-fluid"></div>
            <div class="col-sm-3"><img src="img/foto4.jpeg" class="img-fluid"></div>
        </div>
        <div class="row g-1 mt-1">
            <div class="col-sm-3"><img src="img/foto5.jpeg" class="img-fluid"></div>
            <div class="col-sm-3"><img src="img/foto6.jpeg" class="img-fluid"></div>
            <div class="col-sm-3"><img src="img/foto7.jpeg" class="img-fluid"></div>
            <div class="col-sm-3"><img src="img/foto8.jpeg" class="img-fluid"></div>
        </div>
        <div class="row g-1 mt-1">
            <div class="col-sm-3"><img src="img/foto9.jpeg" class="img-fluid"></div>
            <div class="col-sm-3"><img src="img/foto10.jpeg" class="img-fluid"></div>
            <div class="col-sm-3"><img src="img/foto11.jpeg" class="img-fluid"></div>
            <div class="col-sm-3"><img src="img/foto12.jpeg" class="img-fluid"></div>
        </div>
        <div class="row g-1 mt-1">
            <div class="col-sm-3"><img src="img/foto13.jpeg" class="img-fluid"></div>
            <div class="col-sm-3"><img src="img/foto14.jpeg" class="img-fluid"></div>
            <div class="col-sm-3"><img src="img/foto15.jpeg" class="img-fluid"></div>
            <div class="col-sm-3"><img src="img/foto16.jpeg" class="img-fluid"></div>
        </div>
    </div>

    <footer class="text-center">
        <div class="container">
            <p class="footer-brand"><strong>LagsPhotography</strong></p>
            <p>© Copyright 2026. All Rights Reserved</p>
            <i class="bi bi-instagram"></i>
            <i class="bi bi-camera"></i>
            <i class="bi bi-linkedin"></i>
            <i class="bi bi-facebook"></i>
            <i class="bi bi-twitter-x"></i>
        </div>
    </footer>

</body>
</html>
